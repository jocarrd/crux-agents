name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new run cancels the previous one on the same branch: nobody looks at the
# result of a commit that is no longer HEAD.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # The kernel scripts are bash and node, and the runner ships both. Nothing
      # is installed: if this needed dependencies, the kernel itself would stop
      # being installable on any machine.
      - name: Available tools
        run: |
          bash --version | head -1
          node --version
          shellcheck --version | head -2

      - name: Static analysis of the scripts
        run: |
          # SC1091: do not follow `source` of paths that are resolved at run
          # time. The rest is fixed.
          shellcheck --severity=warning --exclude=SC1091 \
            bin/crux bin/*.sh lib/*.sh install.sh \
            adapters/*/*.sh adapters/claude/hooks/*.sh \
            skills/*/scripts/*.sh test/run.sh test/cases/*.sh

      - name: Kernel suite
        run: ./test/run.sh

      # The failures that cost dearly did not show up in the suite: they showed
      # up when walking the whole cycle in one go, which is what this does.
      - name: End-to-end battery
        run: |
          git config --global user.email ci@localhost
          git config --global user.name ci
          ./test/e2e.sh

      # The suite runs in sandboxes; this checks the real installation path,
      # which is the first thing anyone runs on a new machine and the last thing
      # tested.
      - name: Clean install
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --projects-dir "$HOME/projects"
          test -f "$HOME/.crux/config"
          test -x "$HOME/.local/bin/crux"
          test "$(ls "$HOME/.claude/skills" | wc -l)" -gt 0

      - name: A project from start to finish
        run: |
          export HOME="$(mktemp -d)"
          export CRUX_HOME="$PWD"
          git config --global user.email ci@localhost
          git config --global user.name ci
          mkdir -p "$HOME/projects/demo/api"

          bash bin/init.sh demo --no-remote --parent "$HOME/projects" --repos api
          bash bin/link.sh "$HOME/projects/demo/demo-docs"
          bash bin/doctor.sh "$HOME/projects/demo/demo-docs"

          # The generated pointer has to say how work is done, not just where the
          # documentation is: it is the only thing an agent reads on entering.
          grep -q "How we work here" "$HOME/projects/demo/api/CLAUDE.md"
          grep -q "crux:begin" "$HOME/projects/demo/api/AGENTS.md"
