<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker>
<marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker></defs>
<rect width="1200" height="470" rx="16" fill="#0d1117"/>
<text x="40" y="52" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="start">Switching machines</text><text x="40" y="80" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">Leave with nothing trapped, arrive with everything: projects, your profile, open tasks and the kernel.</text><rect x="40" y="120" width="320" height="300" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="64" y="154" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">Machine you leave</text><text x="64" y="190" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">crux sync --leave</text><text x="64" y="222" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">fails if anything would stay here:</text>
<text x="64" y="246" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">· uncommitted changes</text>
<text x="64" y="270" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">· unpushed commits and branches</text>
<text x="64" y="294" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">· commits on a detached HEAD</text>
<text x="64" y="318" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">· repos whose remote is gone</text>
<text x="64" y="342" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">· tasks not yet published</text><rect x="440" y="150" width="320" height="240" rx="12" fill="#0b3a44" stroke="#22d3ee" stroke-width="1.5"/><text x="464" y="184" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">Your git remote</text><text x="464" y="220" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">&lt;project&gt;-docs   + crux/tasks</text>
<text x="464" y="248" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">code repos</text>
<text x="464" y="276" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">agent-profile</text>
<text x="464" y="304" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">crux, tagged releases</text><text x="464" y="362" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">credentials never travel: carry-env</text><rect x="840" y="120" width="320" height="300" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="864" y="154" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">Machine you arrive at</text><text x="864" y="190" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">crux bootstrap</text><text x="864" y="216" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">a blank machine: discovers every</text>
<text x="864" y="238" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">project from the remote</text><text x="864" y="280" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">crux sync</text><text x="864" y="306" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">one you used before: advances what</text>
<text x="864" y="328" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">is behind, brings the tasks and</text>
<text x="864" y="350" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">the latest kernel; never joins</text>
<text x="864" y="372" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">diverged branches for you</text><path d="M362,270 L436,270" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowA)"/><path d="M762,270 L836,270" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowA)"/>
</svg>
