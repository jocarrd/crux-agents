<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker>
<marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker></defs>
<rect width="1200" height="660" rx="16" fill="#0d1117"/>
<text x="40" y="52" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="start">Where each kind of memory lives</text><text x="40" y="80" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">Three repos on your git remote, each owned by a different thing. Nothing important stays on one machine.</text><rect x="30" y="104" width="1140" height="268" rx="12" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 5"/><text x="52" y="132" font-size="13" font-weight="700" fill="#9198a1" text-anchor="start">YOUR GIT REMOTE</text><rect x="52" y="148" width="344" height="206" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="78" cy="178" r="5" fill="#22d3ee"/><text x="94" y="184" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start">The project</text><text x="76" y="212" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">&lt;project&gt;-docs</text><text x="372" y="184" font-size="13" font-weight="400" fill="#9198a1" text-anchor="end">one per project</text><text x="76" y="246" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· decisions (ADRs)</text>
<text x="76" y="271" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· conventions and runbooks</text>
<text x="76" y="296" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· notes per code repo</text>
<text x="76" y="321" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· tasks, on the crux/tasks branch</text><rect x="428" y="148" width="344" height="206" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="454" cy="178" r="5" fill="#22d3ee"/><text x="470" y="184" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start">You</text><text x="452" y="212" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">agent-profile</text><text x="748" y="184" font-size="13" font-weight="400" fill="#9198a1" text-anchor="end">one per person</text><text x="452" y="246" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· how you want agents to work</text>
<text x="452" y="271" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· who you are and your plans</text>
<text x="452" y="296" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· what only holds on one machine</text>
<text x="452" y="321" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· loaded by every agent you use</text><rect x="804" y="148" width="344" height="206" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><circle cx="830" cy="178" r="5" fill="#22d3ee"/><text x="846" y="184" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start">The rules</text><text x="828" y="212" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">crux</text><text x="1124" y="184" font-size="13" font-weight="400" fill="#9198a1" text-anchor="end">this repo</text><text x="828" y="246" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· the standard every project meets</text>
<text x="828" y="271" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· cross-cutting skills</text>
<text x="828" y="296" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· hooks that block what skips the method</text>
<text x="828" y="321" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">· templates and commands</text><rect x="30" y="420" width="1140" height="214" rx="12" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 5"/><text x="52" y="448" font-size="13" font-weight="700" fill="#9198a1" text-anchor="start">EACH MACHINE</text><rect x="52" y="466" width="520" height="148" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="76" y="498" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">~/Proyectos/&lt;project&gt;/</text><text x="76" y="530" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">&lt;project&gt;-docs/    the docs repo</text>
<text x="76" y="551" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">&lt;repo&gt;/            code, with AGENTS.md</text>
<text x="76" y="572" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">                   pointing to the docs</text>
<text x="76" y="593" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">&lt;repo&gt;-ws-&lt;task&gt;/  one worktree per task</text><rect x="600" y="466" width="270" height="148" rx="12" fill="#0b3a44" stroke="#22d3ee" stroke-width="1.5"/><text x="624" y="498" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start">Your agent</text><text x="624" y="528" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Claude Code or Codex</text>
<text x="624" y="549" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">skills as /&lt;name&gt;</text>
<text x="624" y="570" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">hooks on every action</text>
<text x="624" y="591" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">profile + project context</text><rect x="898" y="466" width="250" height="148" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="922" y="498" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">~/.crux/</text><text x="922" y="530" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">kernel/&lt;version&gt;/</text>
<text x="922" y="551" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">tasks/&lt;project&gt;/</text>
<text x="922" y="572" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">config</text><path d="M224,356 L224,462" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowA)"/><text x="236" y="414" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">crux clone · crux sync</text><path d="M600,356 L735,462" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowA)"/><text x="682" y="404" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">crux profile link</text><path d="M976,356 L1023,462" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowA)"/><text x="1012" y="404" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">install.sh</text>
</svg>
