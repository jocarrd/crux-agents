<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker>
<marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker></defs>
<rect width="1200" height="650" rx="16" fill="#0d1117"/>
<text x="40" y="52" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="start">A task, from start to merge</text><text x="40" y="80" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">Every development task enters through its own space and leaves as a reviewed proposal.</text><rect x="40" y="130" width="168" height="118" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="56" y="164" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">workspace new</text><text x="56" y="196" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">branch, worktree,</text>
<text x="56" y="216" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">ports, task record</text><path d="M210,189 L228,189" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowA)"/><rect x="230" y="130" width="168" height="118" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="246" y="164" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">develop</text><text x="246" y="196" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">crux task add / done</text>
<text x="246" y="216" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">steps with evidence</text><path d="M400,189 L418,189" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowA)"/><rect x="420" y="130" width="168" height="118" rx="12" fill="#0b3a44" stroke="#22d3ee" stroke-width="1.5"/><text x="436" y="164" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">/ship</text><text x="436" y="196" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">the author's gate:</text>
<text x="436" y="216" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">tests, diff, receipt</text><path d="M590,189 L608,189" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowA)"/><rect x="610" y="130" width="168" height="118" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="626" y="164" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">workspace finish</text><text x="626" y="196" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">pushes, opens the</text>
<text x="626" y="216" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">proposal from the task</text><path d="M780,189 L798,189" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowA)"/><rect x="800" y="130" width="168" height="118" rx="12" fill="#0b3a44" stroke="#22d3ee" stroke-width="1.5"/><text x="816" y="164" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">checks + /review-pr</text><text x="816" y="196" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">CI, then an</text>
<text x="816" y="216" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">independent review</text><path d="M970,189 L988,189" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowA)"/><rect x="990" y="130" width="168" height="118" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="1006" y="164" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">merge + rm</text><text x="1006" y="196" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">decisions go to the</text>
<text x="1006" y="216" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">docs repo, task archived</text><path d="M504,248 C504,298 338,298 338,252" stroke="#9198a1" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="413" y="278" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">/ship red</text><path d="M884,248 C884,362 290,362 290,252" stroke="#9198a1" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="599" y="366" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">red CI or review findings: back to develop</text><rect x="40" y="410" width="1120" height="210" rx="12" fill="#3a1d0c" stroke="#fb923c" stroke-width="1.5"/><text x="64" y="444" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">Hooks that stop the agent, whatever it was told</text><circle cx="70" cy="477" r="5" fill="#fb923c"/><text x="86" y="482" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">git reset --hard, push --force, rm -rf ~</text><text x="86" y="501" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">destructive guard</text><circle cx="622" cy="477" r="5" fill="#fb923c"/><text x="638" y="482" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">push to the main branch of a code repo</text><text x="638" y="501" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">pre-push</text><circle cx="70" cy="521" r="5" fill="#fb923c"/><text x="86" y="526" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">gh pr create without the /ship receipt</text><text x="86" y="545" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">proposal guard</text><circle cx="622" cy="521" r="5" fill="#fb923c"/><text x="638" y="526" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">a commit message in the wrong language</text><text x="638" y="545" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">commit-msg</text><circle cx="70" cy="565" r="5" fill="#fb923c"/><text x="86" y="570" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">closing the session with knowledge only on this machine</text><text x="86" y="589" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">memory and docs gates</text><circle cx="622" cy="565" r="5" fill="#fb923c"/><text x="638" y="570" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">running a long suite in the foreground</text><text x="638" y="589" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">wait guard</text>
</svg>
